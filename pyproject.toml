[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "NPY", # numpy-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Notebooks: imports mid-notebook and bare expressions (e.g. `df.head()`) are normal
"*.ipynb" = ["E402", "B018"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
